[project]
name = "arxiv-graphrag"
version = "0.1.0"
description = "arXiv 논문 지식 그래프와 GraphRAG 검색 데모"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "neo4j>=6.0",
    "neo4j-graphrag>=1.18",
    "openai>=2.45",
    "langchain>=1.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain-text-splitters>=1.1",
    "langchain-neo4j>=0.10",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "streamlit>=1.55,<2",
    "graphviz>=0.19,<1",
    "numpy>=2.3,<2.5",
    "scipy>=1.15",
    "plotly>=7.1.0",
    "tqdm>=4.70.0",
]

[project.optional-dependencies]
gds = ["graphdatascience>=1.18", "requests>=2.32"]
notebooks = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.2",
    "pandas>=2.3,<3",
    "matplotlib>=3.9",
    "networkx>=3.4",
    "rdflib>=7.1",
    "sparqlwrapper>=2.0",
    "scikit-learn>=1.5",
    "google-genai>=1.0",
    "langchain-google-genai>=4.0",
    "transformers>=4.57",
    "huggingface-hub>=0.30",
    "torch>=2.0",
    "truststore>=0.10.4",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.12", "tiktoken>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
