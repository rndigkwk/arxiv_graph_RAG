[project]
name = "arxiv-graphrag"
version = "0.1.0"
description = "arXiv 논문 지식 그래프와 GraphRAG 검색 데모"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "neo4j>=6.0",
    "neo4j-graphrag>=1.18",
    "openai>=2.45",
    "langchain>=1.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain-text-splitters>=1.1",
    "langchain-neo4j>=0.10",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "streamlit>=1.55,<2",
    "graphviz>=0.19,<1",
    "numpy>=2.3,<2.5",
    "scipy>=1.15",
    # 예측 패널이 저장된 가중치를 joblib으로 읽고, 그 안에 sklearn 객체가 들어 있습니다
    # (ADR-038). **앱 의존성입니다** - ml 익스트라에만 두면 로컬에서는 되고 배포에서만
    # 깨집니다. 더하기 전에 재서 앱 피크가 266.5MB -> 333.2MB이고, 보수적인 690MB 기준으로
    # 356.8MB가 남습니다(scripts/measure_app_memory.py).
    "scikit-learn>=1.5",
    "networkx>=3.4",
    "plotly>=7.1.0",
    "tqdm>=4.70.0",
]

[project.optional-dependencies]
gds = ["graphdatascience>=1.18", "requests>=2.32"]
ml = ["scikit-learn>=1.5", "mlflow>=2.17"]
notebooks = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.2",
    "pandas>=2.3,<3",
    "matplotlib>=3.9",
    "rdflib>=7.1",
    "sparqlwrapper>=2.0",
    "scikit-learn>=1.5",
    "google-genai>=1.0",
    "langchain-google-genai>=4.0",
    "transformers>=4.57",
    "huggingface-hub>=0.30",
    "torch>=2.0",
    "truststore>=0.10.4",
]

[dependency-groups]
dev = [
    # 조건 판정 심판을 **다른 공급자**로 다시 돌려 보기 위한 것입니다(ADR-058). 앱은 이
    # 패키지를 쓰지 않습니다 - 배포는 dev 그룹을 설치하지 않으므로 ADR-016의 690MB
    # 천장에 닿지 않습니다. 평가 전용으로 두는 이유가 여기 있습니다.
    "langchain-anthropic>=1.0",
    "langchain-community<0.4",
    "langfuse>=5,<6",
    "pytest>=8.3",
    "ragas==0.4.3",
    "ruff>=0.12",
    "tiktoken>=0.14,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest의 기본 임시 루트(Temp/pytest-of-<user>)와 기본 캐시(.pytest_cache)가 이 개발 PC에서
# 읽기조차 거부되는 ACL로 남아 있습니다. 소유권 복구에는 관리자 권한이 필요하므로, 두 경로를
# 작업 폴더 안으로 옮겨 관리자 없이도 전체 테스트가 돌게 합니다. 다른 환경에서도 무해하고,
# 임시 파일이 작업 폴더 안에 머물러 실행이 더 독립적이 됩니다.
cache_dir = ".pytest_cache_local"
addopts = "--basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# 프롬프트 본문은 코드가 아니라 데이터입니다. 줄 길이를 맞추려고 줄바꿈을 넣으면 모델이 읽는
# 글이 바뀌고, 그러면 측정값과 프롬프트 버전이 어긋납니다. 원문을 그대로 둡니다.
"prompts.py" = ["E501"]
