name: Regression evaluation

# 기준선과 대조해 품질 회귀를 막습니다. 판정 규칙과 근거는 docs/adr/ADR-017 과
# baselines/eval_baseline.json 의 note 에 있습니다.
#
# full 실행은 RAGAS 지표 둘도 함께 판정합니다(ADR-021). faithfulness 하한 0.90과 안정 세
# 가족의 context_precision 하한 0.95이며, 사례별 규칙과 허용폭은 두지 않습니다 - 사례별
# 변동폭이 최악 1.0000입니다. RAGAS 보고서가 없으면 full 판정이 실패합니다. 재지 못한 것을
# 통과로 적지 않습니다.
#
# 분할이 둘입니다. PR은 가족마다 한 건씩 5건(smoke), 주간 cron과 수동 실행은 30건 전부(full).
# PR마다 전량을 돌리면 약 366k 토큰이 매 푸시에 듭니다. 앞에서 5건을 자르는 대신 가족마다
# 고르는 이유는 이 과제에서 질문 가족이 승자를 정하기 때문입니다(ADR-008).
#
# Aura Free는 3일 미사용 시 멈추므로 평가 전에 keep_awake.py 를 먼저 돌립니다. keep-alive
# 워크플로가 12시간마다 돌지만, 그것이 비활성화된 상태로 cron이 걸리면 멈춘 DB를 만납니다.
# CLIENT_ID/CLIENT_SECRET 은 인스턴스를 삭제할 수도 있는 관리 API 자격증명이라 저장소 비밀에
# 넣지 않았습니다. 그래서 이 작업은 멈춘 인스턴스를 깨우지 못하고 분명하게 실패합니다.
# `evaluate`는 필수 상태 검사입니다(main 브랜치 보호).
#
# **필수 검사에 `paths:` 필터를 걸면 안 됩니다.** 그 경로를 건드리지 않는 PR에서 잡이 아예
# 보고되지 않아 머지가 영원히 막힙니다. 짝 워크플로에 `paths-ignore`를 두는 방법도 틀립니다 —
# 둘은 배타적이 아닙니다. `paths`는 "하나라도 맞으면 실행"이고 `paths-ignore`는 "하나라도
# 안 맞으면 실행"이라, 양쪽 파일을 함께 바꾼 PR에서는 **둘 다 돌아** 같은 이름의 검사가
# 둘 생깁니다.
#
# 그래서 **항상 돌고, 비싼 단계만 내부에서 가릅니다.** 답변 경로 파일이 바뀌지 않은 PR에서는
# 평가를 건너뛰고 통과를 보고합니다 — 돌릴 이유가 없는 변경이기 때문입니다.
on:
  pull_request:
  schedule:
    # 한국 시간 월요일 오전 7시. keep-alive(37분)와 겹치지 않게 비켜 둡니다.
    - cron: "0 22 * * 0"
  workflow_dispatch:
    inputs:
      split:
        description: "돌릴 분할"
        type: choice
        default: full
        options: [smoke, full]

permissions:
  contents: read

concurrency:
  # 같은 브랜치에 새 커밋이 올라오면 진행 중인 평가를 취소해 토큰을 아낍니다.
  group: regression-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    # full은 에이전트 30건(약 10분)에 RAGAS 채점(30건 x 3지표, 약 20~25분)이 더해져
    # 35분 안팎입니다. 45분은 빡빡해서 올립니다 - 올리는 이유가 품질이 아니라 추가한
    # 단계의 길이이고, 이 값에 닿으면 멈춘 것이 아니라 끊긴 것입니다.
    timeout-minutes: 75
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # 앱과 RAGAS 판정이 같은 모델을 쓰게 **명시**합니다. 비워 두면 각 스크립트의
      # 기본값으로 갈라지고, 2026-10-17에 실제로 기준선과 다른 판정으로 채점했습니다.
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6-luna' }}
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE }}
      # 평가 결과 파일이 없으면 건너뛰기가 아니라 실패가 되게 합니다. 그러지 않으면 평가가
      # 깨진 날 게이트가 초록색이 됩니다.
      EVAL_GATE_REQUIRED: "1"
      PYTHONIOENCODING: utf-8
      # 요율은 비밀이 아니므로 저장소 변수(vars)로 둡니다. 비어 있으면 pricing_from_env가
      # None을 돌려주고 보고서의 cost_usd가 null로 남습니다 - 지금까지 그 상태였습니다.
      # 네 개를 모두 채우면 다음 실행부터 보고서에 금액이 직접 기록됩니다.
      EVAL_CHAT_INPUT_USD_PER_1M: ${{ vars.EVAL_CHAT_INPUT_USD_PER_1M }}
      EVAL_CHAT_OUTPUT_USD_PER_1M: ${{ vars.EVAL_CHAT_OUTPUT_USD_PER_1M }}
      EVAL_EMBEDDING_USD_PER_1M: ${{ vars.EVAL_EMBEDDING_USD_PER_1M }}
      EVAL_PRICING_SOURCE: ${{ vars.EVAL_PRICING_SOURCE }}
      # 추적은 **평가에서만** 켭니다(ADR-023). 앱에서는 켜지 않습니다 - 방문자 수에
      # 비례해 발생량을 셀 수 없기 때문입니다. 세 값이 모두 있어야 보내므로, 키를
      # 등록하지 않은 지금은 vars.LANGFUSE_TRACING을 켜도 no-op입니다.
      LANGFUSE_TRACING: ${{ vars.LANGFUSE_TRACING }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
      # 30건 평가 한 번은 통과하고, 켜 둔 채 루프를 돌리면 거기서 끊깁니다. 단위는
      # 하루(UTC)지만, 러너가 매번 새로 만들어져 계수기 파일이 남지 않으므로 여기서는
      # 사실상 실행당입니다 — 평가 한 번이 한 실행이라 그래도 맞습니다(ADR-023).
      LANGFUSE_MAX_TRACES: ${{ vars.LANGFUSE_MAX_TRACES || '50' }}
    steps:

      - uses: actions/checkout@v4
        with:
          # 범위 판정이 `git diff origin/<base>...HEAD`를 씁니다. 기본 깊이 1에서는
          # 기준 커밋이 없어 그 명령이 실패합니다.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: uv sync --locked --group dev

      - name: Decide whether the answer path changed
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 답변에 닿는 파일 전부. 하나라도 빠지면 그 변경이 게이트를 지나지 않습니다.
          watched='^(chatbot|prompts|agent_graph|routing|abstain|title_search|pagerank|answer_validation|candidate_validation|cypher_validation)\.py$|^evals/|^baselines/|^tests/test_eval_gate\.py$|^\.github/workflows/regression-eval\.yml$'
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$changed" | grep -qE "$watched"; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "run=0" >> "$GITHUB_OUTPUT"
            echo "답변 경로 파일이 바뀌지 않아 회귀 평가를 건너뜁니다." >> "$GITHUB_STEP_SUMMARY"
            echo "판정 규칙과 근거: docs/adr/ADR-017-regression-gate.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check secrets
        if: steps.scope.outputs.run == '1'
        run: |
          missing=""
          for name in OPENAI_API_KEY NEO4J_URI NEO4J_USERNAME NEO4J_PASSWORD; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Set these repository secrets:$missing"
            exit 1
          fi

      - name: Decide the split
        id: split
        if: steps.scope.outputs.run == '1'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "name=smoke" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.split || 'full' }}" >> "$GITHUB_OUTPUT"
          fi

      # 드라이버와 HTTP 클라이언트만 필요합니다. 앱 의존성은 쓰지 않습니다.
      - name: Wake Aura
        if: steps.scope.outputs.run == '1'
        run: uvx --with neo4j --with requests python scripts/keep_awake.py

      - name: Run the evaluation
        if: steps.scope.outputs.run == '1'
        run: |
          split="${{ steps.split.outputs.name }}"
          ids=$(uv run --locked python -c "
          import json, sys
          baseline = json.load(open('baselines/eval_baseline.json', encoding='utf-8'))
          print(','.join(baseline['splits'][sys.argv[1]]))
          " "$split")
          uv run --locked python -m evals.run \
            --mode compare \
            --cases evals/cases_graph.json \
            --case-ids "$ids" \
            --output "reports/regression_${split}.json"

      # RAGAS는 full에서만 돌립니다. smoke는 집계 규칙을 아예 적용하지 않으므로(모수가
      # 다릅니다) 돌려도 판정에 쓰이지 않고 판정 호출 약 450회만 더 듭니다.
      - name: Score with RAGAS
        if: steps.scope.outputs.run == '1' && (steps.split.outputs.name == 'full')
        run: |
          uv run --locked --group dev python -m evals.ragas_study \
            --report reports/regression_full.json \
            --label "weekly ${{ github.run_number }}" \
            --output reports/regression_full_ragas.json

      - name: Compare against the baseline
        if: steps.scope.outputs.run == '1' && (always())
        run: |
          split="${{ steps.split.outputs.name }}"
          test -f "reports/regression_${split}.json" || exit 0
          ragas=""
          if [ -f reports/regression_full_ragas.json ]; then
            ragas="--ragas reports/regression_full_ragas.json"
          fi
          uv run --locked python -m evals.gate \
            --report "reports/regression_${split}.json" \
            $ragas \
            --split "$split"

      - name: Judge
        if: steps.scope.outputs.run == '1'
        run: uv run --locked python -m pytest -q tests/test_eval_gate.py --junitxml=reports/junit.xml

      - name: Summarize
        if: steps.scope.outputs.run == '1' && (always())
        run: |
          # 예산이 바닥나 **돌리지 못한** 경우를 품질 회귀와 구별해 맨 위에 적습니다
          # (ADR-044). 게이트는 여전히 실패합니다 - 돌리지 못한 검사는 통과가 아닙니다.
          if [ -f reports/eval_not_run.json ]; then
            uv run --locked python -m evals.budget --explain >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f reports/summary.md ]; then
            cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          elif [ ! -f reports/eval_not_run.json ]; then
            echo "평가 요약이 없습니다. 앞 단계의 로그를 보세요." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the reports
        if: steps.scope.outputs.run == '1' && (always())
        uses: actions/upload-artifact@v4
        with:
          name: regression-eval-${{ steps.split.outputs.name }}-${{ github.run_number }}
          path: |
            reports/regression_*.json
            reports/eval_gate.json
            reports/eval_not_run.json
            reports/summary.md
            reports/junit.xml
          retention-days: 30
          if-no-files-found: warn

  # ── 장부 ──────────────────────────────────────────────────────────────────
  # [ADR-055](../../docs/adr/ADR-055-the-stable-case-rule-is-not-resolved.md)가 "stable_case가
  # 변동으로 터지는가"에 405쌍이 필요한데 366쌍뿐이고, **모자란 이유가 데이터를 버리고 있었기
  # 때문**이라고 적었습니다. `reports/regression_*.json`이 gitignore이고 CI는 커밋을 되돌려
  # 보내지 않아서, 주간 크론이 만들어 내는 30쌍이 매번 사라집니다. full 2회면 닿습니다.
  #
  # **별도 job인 이유가 보안입니다.** `contents: write`가 필요한데, 위 job에 주면 PR 실행에도
  # 같은 토큰이 붙습니다. 이 job은 `pull_request`에서 아예 돌지 않으므로 쓰기 권한이 PR
  # 경로에 닿지 않습니다.
  #
  # **아티팩트의 보고서로 `--backfill`을 돌립니다.** 장부 파일을 그대로 올려 쓰면 그 사이
  # main에 붙은 줄을 덮어씁니다. 보고서에서 다시 만들면 **그때의 main 장부에 덧붙이는** 것이
  # 되므로 레이스에서 줄이 날아가지 않습니다.
  ledger:
    needs: evaluate
    # 크론과 수동 실행만. PR은 자기 코드 상태의 줄이므로 main 장부에 섞으면 안 됩니다.
    if: github.event_name != 'pull_request' && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev

      # **실패를 삼키는 step 옵션을 쓰지 않습니다.** 그것은 게이트를 통과로 바꿀 수 있어서
      # 테스트가 이 워크플로 전체에서 금지합니다(그 낱말이 주석에도 없어야 검사가 단순하게
      # 유지됩니다). 여기서는 필요하지도 않습니다 - 위 scope 단계가 PR이 아니면 무조건
      # `run=1`이므로 크론·수동 실행에서는 아티팩트가 항상 올라갑니다. 아주 드물게 없으면
      # **이 job만 빨개지고** 평가 판정은 그대로입니다(별 job입니다).
      - uses: actions/download-artifact@v4
        with:
          pattern: regression-eval-*
          merge-multiple: true
          path: downloaded

      - name: Append the run to the ledger
        run: |
          set -euo pipefail
          # 내려받은 보고서는 **외부 입력으로 다룹니다.** 제자리에 두고 경로만 넘깁니다.
          # 비어 있으면 `--backfill`이 0줄을 더하고 아래 diff 검사가 조용히 끝냅니다.
          mkdir -p downloaded
          uv run --locked python -m evals.ledger --backfill --reports downloaded
          if git diff --quiet -- reports/case_ledger.jsonl; then
            echo "장부에 새 줄이 없습니다(이미 있는 실행)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/case_ledger.jsonl
          # `[skip ci]`가 없으면 이 커밋이 ci.yml을 다시 띄웁니다 - 주마다 한 번씩 헛돕니다.
          git commit -m "장부: 평가 실행 한 줄 [skip ci]"
          # main이 움직였을 수 있습니다. 장부는 덧붙이기만 하므로 리베이스로 붙습니다.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              uv run --locked python -m evals.ledger --summary >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          # **평가 판정을 뒤집지 않습니다.** 장부를 못 밀어 넣은 것은 품질과 무관합니다.
          echo "::warning::장부를 main에 밀어 넣지 못했습니다. 다음 실행이 다시 시도합니다."
