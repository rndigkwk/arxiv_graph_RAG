name: Regression evaluation

# 기준선과 대조해 품질 회귀를 막습니다. 판정 규칙과 근거는 docs/adr/ADR-017 과
# baselines/eval_baseline.json 의 note 에 있습니다.
#
# full 실행은 RAGAS 지표 둘도 함께 판정합니다(ADR-021). faithfulness 하한 0.90과 안정 세
# 가족의 context_precision 하한 0.95이며, 사례별 규칙과 허용폭은 두지 않습니다 - 사례별
# 변동폭이 최악 1.0000입니다. RAGAS 보고서가 없으면 full 판정이 실패합니다. 재지 못한 것을
# 통과로 적지 않습니다.
#
# 분할이 둘입니다. PR은 가족마다 한 건씩 5건(smoke), 주간 cron과 수동 실행은 30건 전부(full).
# PR마다 전량을 돌리면 약 366k 토큰이 매 푸시에 듭니다. 앞에서 5건을 자르는 대신 가족마다
# 고르는 이유는 이 과제에서 질문 가족이 승자를 정하기 때문입니다(ADR-008).
#
# Aura Free는 3일 미사용 시 멈추므로 평가 전에 keep_awake.py 를 먼저 돌립니다. keep-alive
# 워크플로가 12시간마다 돌지만, 그것이 비활성화된 상태로 cron이 걸리면 멈춘 DB를 만납니다.
# CLIENT_ID/CLIENT_SECRET 은 인스턴스를 삭제할 수도 있는 관리 API 자격증명이라 저장소 비밀에
# 넣지 않았습니다. 그래서 이 작업은 멈춘 인스턴스를 깨우지 못하고 분명하게 실패합니다.
on:
  pull_request:
    paths:
      - chatbot.py
      - answer_validation.py
      - candidate_validation.py
      - cypher_validation.py
      - evals/**
      - baselines/**
      - tests/test_eval_gate.py
      - .github/workflows/regression-eval.yml
  schedule:
    # 한국 시간 월요일 오전 7시. keep-alive(37분)와 겹치지 않게 비켜 둡니다.
    - cron: "0 22 * * 0"
  workflow_dispatch:
    inputs:
      split:
        description: "돌릴 분할"
        type: choice
        default: full
        options: [smoke, full]

permissions:
  contents: read

concurrency:
  # 같은 브랜치에 새 커밋이 올라오면 진행 중인 평가를 취소해 토큰을 아낍니다.
  group: regression-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    # full은 에이전트 30건(약 10분)에 RAGAS 채점(30건 x 3지표, 약 20~25분)이 더해져
    # 35분 안팎입니다. 45분은 빡빡해서 올립니다 - 올리는 이유가 품질이 아니라 추가한
    # 단계의 길이이고, 이 값에 닿으면 멈춘 것이 아니라 끊긴 것입니다.
    timeout-minutes: 75
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE }}
      # 평가 결과 파일이 없으면 건너뛰기가 아니라 실패가 되게 합니다. 그러지 않으면 평가가
      # 깨진 날 게이트가 초록색이 됩니다.
      EVAL_GATE_REQUIRED: "1"
      PYTHONIOENCODING: utf-8
      # 요율은 비밀이 아니므로 저장소 변수(vars)로 둡니다. 비어 있으면 pricing_from_env가
      # None을 돌려주고 보고서의 cost_usd가 null로 남습니다 - 지금까지 그 상태였습니다.
      # 네 개를 모두 채우면 다음 실행부터 보고서에 금액이 직접 기록됩니다.
      EVAL_CHAT_INPUT_USD_PER_1M: ${{ vars.EVAL_CHAT_INPUT_USD_PER_1M }}
      EVAL_CHAT_OUTPUT_USD_PER_1M: ${{ vars.EVAL_CHAT_OUTPUT_USD_PER_1M }}
      EVAL_EMBEDDING_USD_PER_1M: ${{ vars.EVAL_EMBEDDING_USD_PER_1M }}
      EVAL_PRICING_SOURCE: ${{ vars.EVAL_PRICING_SOURCE }}
    steps:
      - name: Check secrets
        run: |
          missing=""
          for name in OPENAI_API_KEY NEO4J_URI NEO4J_USERNAME NEO4J_PASSWORD; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Set these repository secrets:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: uv sync --locked --group dev

      - name: Decide the split
        id: split
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "name=smoke" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.split || 'full' }}" >> "$GITHUB_OUTPUT"
          fi

      # 드라이버와 HTTP 클라이언트만 필요합니다. 앱 의존성은 쓰지 않습니다.
      - name: Wake Aura
        run: uvx --with neo4j --with requests python scripts/keep_awake.py

      - name: Run the evaluation
        run: |
          split="${{ steps.split.outputs.name }}"
          ids=$(uv run --locked python -c "
          import json, sys
          baseline = json.load(open('baselines/eval_baseline.json', encoding='utf-8'))
          print(','.join(baseline['splits'][sys.argv[1]]))
          " "$split")
          uv run --locked python -m evals.run \
            --mode compare \
            --cases evals/cases_graph.json \
            --case-ids "$ids" \
            --output "reports/regression_${split}.json"

      # RAGAS는 full에서만 돌립니다. smoke는 집계 규칙을 아예 적용하지 않으므로(모수가
      # 다릅니다) 돌려도 판정에 쓰이지 않고 판정 호출 약 450회만 더 듭니다.
      - name: Score with RAGAS
        if: steps.split.outputs.name == 'full'
        run: |
          uv run --locked --group dev python -m evals.ragas_study \
            --report reports/regression_full.json \
            --label "weekly ${{ github.run_number }}" \
            --output reports/regression_full_ragas.json

      - name: Compare against the baseline
        if: always()
        run: |
          split="${{ steps.split.outputs.name }}"
          test -f "reports/regression_${split}.json" || exit 0
          ragas=""
          if [ -f reports/regression_full_ragas.json ]; then
            ragas="--ragas reports/regression_full_ragas.json"
          fi
          uv run --locked python -m evals.gate \
            --report "reports/regression_${split}.json" \
            $ragas \
            --split "$split"

      - name: Judge
        run: uv run --locked python -m pytest -q tests/test_eval_gate.py --junitxml=reports/junit.xml

      - name: Summarize
        if: always()
        run: |
          if [ -f reports/summary.md ]; then
            cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "평가 요약이 없습니다. 앞 단계의 로그를 보세요." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-eval-${{ steps.split.outputs.name }}-${{ github.run_number }}
          path: |
            reports/regression_*.json
            reports/eval_gate.json
            reports/summary.md
            reports/junit.xml
          retention-days: 30
          if-no-files-found: warn
