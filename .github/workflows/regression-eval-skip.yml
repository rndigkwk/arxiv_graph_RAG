name: Regression evaluation (skip)

# **필수 상태 검사의 짝입니다.** `evaluate`를 main 브랜치 보호의 필수 검사로 걸어 뒀는데,
# regression-eval.yml 은 답변 경로 파일이 바뀔 때만 돕니다. 필수 검사에 경로 필터를 걸면 그
# 경로를 건드리지 않는 PR에서 잡이 보고되지 않아 **머지가 영원히 막힙니다**.
#
# 그래서 같은 이름의 잡으로 보완 경로를 받아 통과를 보고합니다. 평가를 돌리지 않습니다 -
# 돌릴 이유가 없는 변경이기 때문입니다. 두 워크플로의 경로는 서로 배타적이어야 하고, 한쪽에
# 파일을 더하면 다른 쪽에서 빼야 합니다.
on:
  pull_request:
    paths-ignore:
      - chatbot.py
      - prompts.py
      - agent_graph.py
      - routing.py
      - abstain.py
      - title_search.py
      - pagerank.py
      - answer_validation.py
      - candidate_validation.py
      - cypher_validation.py
      - evals/**
      - baselines/**
      - tests/test_eval_gate.py
      - .github/workflows/regression-eval.yml

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: 답변 경로가 바뀌지 않았습니다
        run: |
          echo "이 PR은 답변 경로 파일을 건드리지 않아 회귀 평가를 돌리지 않습니다." >> "$GITHUB_STEP_SUMMARY"
          echo "판정 규칙과 근거: docs/adr/ADR-017-regression-gate.md" >> "$GITHUB_STEP_SUMMARY"
