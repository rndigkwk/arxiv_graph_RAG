name: Check deployed app
# Since 2026-10-26 the app runs on a GCP VM that pulls main every two minutes
# (deploy/vm/deploy.sh, ADR-080). Nothing here touches the VM: this job only waits, up to ten
# minutes, for the pushed commit to appear on the page.
#
# Since 2026-10-27 the VM runs only the API and the database; the screens are the Next.js app on
# Vercel (ADR-083). So this check needs no browser: it reads /api/health, whose two commits are
# the checkout on disk and the module the API process imported, and compares both with this
# commit (an old module after a merge is what ADR-072 was about). It then reads /api/stats to see
# the graph answer, and fetches the Vercel page.
#
# A second step reads the weekly ingest the VM's timer runs (ADR-106): GitHub cannot see that run,
# so a failed or missing ingest would otherwise leave the graph quietly behind.
#
# No model calls. A failure on main opens an issue through alert-on-failure.yml.
# The Streamlit Cloud backup app can still be checked by hand with --streamlit (see the script).
on:
  schedule:
    - cron: "17 */8 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployed-app
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The API is not restarted when a merge changes only files it does not read (ADR-107), so
          # its module commit can be a few commits behind. The check diffs the two with git.
          fetch-depth: 100
      - name: Check the deployed API and screens
        run: python3 scripts/visit_deployed_app.py --expect-commit "${{ github.sha }}"
      - name: Check the VM's weekly ingest
        # Runs even when the deploy check failed, so one alert names both.
        if: ${{ !cancelled() }}
        run: python3 scripts/visit_deployed_app.py --ingest
      - name: Check the monthly forecast-model monitor
        # The VM re-scores the deployed graph-text-gbm on last month's labels (ADR-124).
        if: ${{ !cancelled() }}
        run: python3 scripts/visit_deployed_app.py --forecast-monitor
