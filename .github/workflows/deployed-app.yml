name: Check deployed app
# Opens the deployed Streamlit app in a headless browser (scripts/check_deployed_app.py): clicks
# "Yes, get this app back up!" when it sleeps, waits for the first screen (which needs Aura), and
# compares the deploy stamp with this commit. It fails when the search module is older than the
# page - Streamlit Cloud kept an old `chatbot` module until a reboot twice (ADR-072).
#
# keep-alive.yml's HTTP visit cannot do either: Streamlit counts browser sessions, so a sleeping
# app stayed asleep while that job kept succeeding (ADR-016, 2026-10-25).
#
# No model calls: it asks nothing, it only renders the page. A failure on main opens an issue
# through alert-on-failure.yml.
on:
  schedule:
    - cron: "17 */8 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployed-app
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install the browser
        run: uvx --with playwright==1.64.1 playwright install --with-deps chromium
      - name: Check the deployed app
        run: >
          uvx --with playwright==1.64.1
          python scripts/check_deployed_app.py --expect-commit "${{ github.sha }}"
