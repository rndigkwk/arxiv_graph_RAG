name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv lock --check
      - run: uv sync --locked --group dev
      - run: uv run --locked python -c "import networkx, plotly, streamlit"
      - run: uv run --locked ruff check answer_validation.py candidate_validation.py cypher_validation.py prompts.py agent_graph.py routing.py abstain.py pagerank.py title_search.py forecast.py evals tests scripts pipeline models
      - run: uv run --locked python -m pytest -q
      - run: uv run --locked python scripts/check_doc_links.py
      - run: uv run --locked python scripts/check_doc_numbers.py
      - run: uv run --locked python -m compileall -q app.py chatbot.py answer_validation.py candidate_validation.py cypher_validation.py prompts.py agent_graph.py routing.py abstain.py pagerank.py title_search.py gds_pagerank.py metagraph.py evals scripts pipeline models
