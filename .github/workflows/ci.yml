name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv lock --check
      - run: uv sync --locked --group dev
      - run: uv run --locked python -c "import networkx, plotly, streamlit"
      - run: uv run --locked ruff check src app.py evals tests scripts pipeline models
      - run: uv run --locked python -m pytest -q
      # 검사기도 손으로 적지 않고 글로브로 넘깁니다. 두 줄짜리 목록에 세 번째
      # (`check_adr_rules.py`)를 더하려다 이것이 같은 병임을 알았습니다 - 아래 compileall과
      # 같은 이유입니다. 새 검사기를 더하면 CI가 알아서 집습니다.
      - run: |
          for checker in scripts/check_*.py; do
            echo "== $checker"
            uv run --locked python "$checker" || exit 1
          done
      # 모듈이 src/로 들어가서 위의 ruff 줄에서 손 목록이 사라졌습니다(ADR-068). 전에는 그
      # 목록이 `forecast.py`·`quality_board.py`·`paper_library.py`를 놓치고 있었고,
      # `chatbot.py`와 `app.py`는 아예 검사 밖이었습니다 - 이제 둘 다 들어옵니다.
      - run: uv run --locked python -m compileall -q app.py src evals scripts pipeline models
