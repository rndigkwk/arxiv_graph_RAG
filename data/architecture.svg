<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">arXiv GraphRAG architecture (2026-11)</title>
  <desc id="desc">The browser loads the Next.js app on Vercel, which calls FastAPI on one GCP VM behind Caddy. The answer flow runs app nodes, then a gpt-6-luna agent with three tools over Neo4j, then format and condition checks. A weekly ingest pulls arXiv and Semantic Scholar into Neo4j. Pull requests pass CI and a regression gate before main, which the VM deploy timer pulls every two minutes.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#64748b" flood-opacity=".16"/></filter>
    <style>
      text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',Inter,'Segoe UI',sans-serif}
      .title{font-size:28px;font-weight:700;fill:#0f172a}
      .subtitle{font-size:15px;fill:#475569}
      .section{font-size:13px;font-weight:700;letter-spacing:1.2px;fill:#64748b}
      .h{font-size:17px;font-weight:700;fill:#fff}
      .t{font-size:13.5px;fill:#e2e8f0}
      .hd{font-size:16px;font-weight:700;fill:#0f172a}
      .td{font-size:13px;fill:#334155}
      .chip{font-size:13px;font-weight:600;fill:#1e3a8a}
      .edge{font-size:12px;font-weight:600;fill:#475569}
      .mono{font-family:Consolas,'Cascadia Mono',monospace;font-size:12.5px;fill:#e2e8f0}
      .line{stroke:#64748b;stroke-width:2;fill:none}
    </style>
  </defs>

  <rect width="1400" height="800" rx="20" fill="#f8fafc"/>
  <text x="40" y="52" class="title">arXiv GraphRAG · 지금 배포된 구조</text>
  <text x="40" y="80" class="subtitle">Vercel의 Next.js 화면 → GCP VM 한 대(Caddy · FastAPI · Neo4j) → OpenAI. 코드로 가릴 수 있는 질문은 모델보다 앱 노드가 먼저 처리합니다.</text>

  <!-- 사용자 쪽 -->
  <text x="40" y="128" class="section">USER</text>
  <g filter="url(#shadow)">
    <rect x="40" y="140" width="260" height="78" rx="14" fill="#fff" stroke="#cbd5e1"/>
    <text x="60" y="172" class="hd">브라우저</text>
    <text x="60" y="198" class="td">한국어로 질문해도 됩니다</text>

    <rect x="40" y="262" width="260" height="196" rx="14" fill="#0f172a"/>
    <text x="60" y="294" class="h">Vercel · Next.js (web/)</text>
    <text x="60" y="324" class="t">질문 · 논문 · 탐색 · 품질 · 그래프</text>
    <text x="60" y="350" class="t">영어 답을 먼저 보이고</text>
    <text x="60" y="372" class="t">한국어 번역을 흘려 보냅니다(SSE)</text>
    <text x="60" y="404" class="t">main에 머지되면 자동 배포</text>
    <text x="60" y="436" class="mono">arxiv-graphrag.vercel.app</text>
  </g>
  <path d="M170 218 L170 258" class="line" marker-end="url(#arrow)"/>

  <!-- VM -->
  <rect x="330" y="108" width="750" height="532" rx="18" fill="#eef2ff" stroke="#6366f1" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="352" y="134" class="section" style="fill:#4338ca">GCP VM · DOCKER COMPOSE</text>

  <g filter="url(#shadow)">
    <rect x="352" y="150" width="200" height="66" rx="12" fill="#334155"/>
    <text x="372" y="178" class="h">Caddy</text>
    <text x="372" y="201" class="t">HTTPS · /api만 엽니다</text>

    <rect x="352" y="250" width="200" height="190" rx="12" fill="#1d4ed8"/>
    <text x="372" y="280" class="h">FastAPI</text>
    <text x="372" y="302" class="mono">src/api.py</text>
    <text x="372" y="330" class="t">/api/ask (SSE)</text>
    <text x="372" y="352" class="t">/api/papers · rank · search</text>
    <text x="372" y="374" class="t">/api/quality · overview</text>
    <text x="372" y="406" class="t">IP당 분당 3회 · 하루 30회</text>
  </g>
  <path d="M300 290 L348 196" class="line" marker-end="url(#arrow)"/>
  <text x="262" y="240" class="edge">HTTPS</text>
  <path d="M452 216 L452 246" class="line" marker-end="url(#arrow)"/>

  <!-- 답 흐름 -->
  <rect x="580" y="150" width="480" height="290" rx="14" fill="#fff" stroke="#c7d2fe"/>
  <text x="598" y="174" class="section">답 흐름 · LANGGRAPH (src/agent_graph.py)</text>
  <text x="598" y="200" class="td">앱 노드 — 해당하는 질문에만 메시지를 붙이고, 모델 턴은 쓰지 않습니다</text>
  <g>
    <rect x="598" y="212" width="66" height="30" rx="15" fill="#dbeafe"/><text x="631" y="232" class="chip" text-anchor="middle">번역</text>
    <rect x="672" y="212" width="66" height="30" rx="15" fill="#dbeafe"/><text x="705" y="232" class="chip" text-anchor="middle">제목</text>
    <rect x="746" y="212" width="66" height="30" rx="15" fill="#dbeafe"/><text x="779" y="232" class="chip" text-anchor="middle">최근</text>
    <rect x="820" y="212" width="66" height="30" rx="15" fill="#dbeafe"/><text x="853" y="232" class="chip" text-anchor="middle">분류</text>
    <rect x="894" y="212" width="66" height="30" rx="15" fill="#dbeafe"/><text x="927" y="232" class="chip" text-anchor="middle">저자</text>
    <rect x="968" y="212" width="74" height="30" rx="15" fill="#fee2e2"/><text x="1005" y="232" class="chip" text-anchor="middle" fill="#991b1b">범위 밖</text>
  </g>
  <path d="M556 330 L576 330" class="line" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="598" y="262" width="270" height="160" rx="12" fill="#0f766e"/>
    <text x="616" y="290" class="h">에이전트 · gpt-6-luna</text>
    <text x="616" y="318" class="mono">search_graph</text>
    <text x="736" y="318" class="t">Cypher · 10행 상한</text>
    <text x="616" y="344" class="mono">search_papers</text>
    <text x="736" y="344" class="t">768차원 벡터</text>
    <text x="616" y="370" class="mono">resolve_paper</text>
    <text x="736" y="370" class="t">제목 전문 검색</text>
    <text x="616" y="402" class="t">답 + 근거 arXiv ID(구조화 출력)</text>

    <rect x="888" y="262" width="154" height="160" rx="12" fill="#7c3aed"/>
    <text x="904" y="290" class="h">검사</text>
    <text x="904" y="318" class="t">형식 · 인용</text>
    <text x="904" y="342" class="t">조건(판정 모델)</text>
    <text x="904" y="374" class="t">통과 / 한 번 수정</text>
    <text x="904" y="398" class="t">/ 보류</text>
  </g>
  <path d="M868 342 L884 342" class="line" marker-end="url(#arrow)"/>

  <!-- Neo4j와 타이머 -->
  <g filter="url(#shadow)">
    <rect x="352" y="474" width="470" height="146" rx="14" fill="#065f46"/>
    <text x="372" y="504" class="h">Neo4j 5 · 지식 그래프</text>
    <text x="372" y="532" class="t">논문 43,728 · 저자 123,402</text>
    <text x="372" y="556" class="t">REFERENCES 148,051 · AUTHORED 304,479</text>
    <text x="372" y="586" class="t">벡터 인덱스(768D) · 제목·저자 전문 색인</text>
    <text x="372" y="608" class="edge" style="fill:#a7f3d0">2026-11-10 기준 · 매주 자랍니다</text>

    <rect x="846" y="474" width="214" height="66" rx="12" fill="#b45309"/>
    <text x="864" y="502" class="h">주간 수집</text>
    <text x="864" y="525" class="t">월 12:19 KST · systemd</text>

    <rect x="846" y="554" width="214" height="66" rx="12" fill="#475569"/>
    <text x="864" y="582" class="h">배포 타이머</text>
    <text x="864" y="605" class="t">2분마다 main을 당깁니다</text>
  </g>
  <path d="M700 422 L700 470" class="line" marker-end="url(#arrow)"/>
  <text x="708" y="452" class="edge">Cypher · 벡터 · 전문 검색</text>
  <path d="M846 507 L826 507" class="line" marker-end="url(#arrow)"/>

  <!-- 외부 서비스 -->
  <text x="1110" y="128" class="section">EXTERNAL</text>
  <g filter="url(#shadow)">
    <rect x="1110" y="150" width="250" height="150" rx="14" fill="#fff" stroke="#cbd5e1"/>
    <text x="1130" y="180" class="hd">OpenAI API</text>
    <text x="1130" y="208" class="td">gpt-6-luna</text>
    <text x="1130" y="228" class="td">에이전트 · 질문 번역 · 답 번역</text>
    <text x="1130" y="258" class="td">text-embedding-3-large</text>
    <text x="1130" y="278" class="td">질문만 임베딩(768D)</text>

    <rect x="1110" y="440" width="250" height="64" rx="14" fill="#fff" stroke="#cbd5e1"/>
    <text x="1130" y="468" class="hd">arXiv OAI-PMH</text>
    <text x="1130" y="490" class="td">새 cs.AI 논문 메타데이터</text>

    <rect x="1110" y="522" width="250" height="64" rx="14" fill="#fff" stroke="#cbd5e1"/>
    <text x="1130" y="550" class="hd">Semantic Scholar</text>
    <text x="1130" y="572" class="td">새 논문의 참고문헌</text>
  </g>
  <path d="M1060 225 L1106 225" class="line" marker-end="url(#arrow)"/>
  <path d="M1110 472 L1064 498" class="line" marker-end="url(#arrow)"/>
  <path d="M1110 554 L1064 516" class="line" marker-end="url(#arrow)"/>

  <!-- GitHub -->
  <text x="40" y="672" class="section">GITHUB · 머지 전에 막습니다</text>
  <g filter="url(#shadow)">
    <rect x="40" y="686" width="150" height="80" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <text x="60" y="718" class="hd">PR</text>
    <text x="60" y="742" class="td">base는 항상 main</text>

    <rect x="226" y="686" width="250" height="80" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <text x="246" y="718" class="hd">CI</text>
    <text x="246" y="742" class="td">ruff · pytest · 문서 수치 점검</text>

    <rect x="512" y="686" width="300" height="80" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <text x="532" y="718" class="hd">회귀 평가 · 품질 게이트</text>
    <text x="532" y="742" class="td">smoke 5문항 · 지표 10개가 하한 위</text>

    <rect x="846" y="686" width="214" height="80" rx="12" fill="#0f172a"/>
    <text x="866" y="718" class="h">main</text>
    <text x="866" y="742" class="t">VM과 Vercel이 받아 갑니다</text>

    <rect x="1110" y="686" width="250" height="80" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <text x="1130" y="718" class="hd">MLflow (DagsHub)</text>
    <text x="1130" y="742" class="td">프롬프트 버전 · 평가 · 모델 등록</text>
  </g>
  <path d="M190 726 L222 726" class="line" marker-end="url(#arrow)"/>
  <path d="M476 726 L508 726" class="line" marker-end="url(#arrow)"/>
  <path d="M812 726 L842 726" class="line" marker-end="url(#arrow)"/>
  <path d="M953 686 L953 624" class="line" marker-end="url(#arrow)"/>
</svg>
