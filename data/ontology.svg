<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">arXiv GraphRAG ontology</title>
  <desc id="desc">ArxivAuthorName authors ArxivPaper, which references another ArxivPaper. Categories are properties on ArxivPaper.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eff6ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#64748b" flood-opacity=".18"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="3.5" orient="auto"><path d="M0,0 L11,3.5 L0,7 Z" fill="#475569"/></marker>
    <style>
      .title{font:700 30px Inter,Segoe UI,sans-serif;fill:#0f172a}.subtitle{font:400 16px Inter,Segoe UI,sans-serif;fill:#475569}
      .node-title{font:700 21px Inter,Segoe UI,sans-serif;fill:#fff}.node-text{font:400 15px Inter,Segoe UI,sans-serif;fill:#dbeafe}
      .edge{font:700 15px Inter,Segoe UI,sans-serif;fill:#334155}.note{font:400 15px Inter,Segoe UI,sans-serif;fill:#475569}.mono{font:500 15px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#1e293b}
    </style>
  </defs>
  <rect width="1200" height="650" rx="24" fill="url(#bg)"/>
  <text x="65" y="62" class="title">arXiv GraphRAG · ontology</text>
  <text x="65" y="92" class="subtitle">논문·저자·인용을 최소한의 명확한 노드와 관계로 표현합니다.</text>

  <g filter="url(#shadow)">
    <rect x="75" y="190" width="290" height="190" rx="18" fill="#2563eb"/>
    <text x="105" y="232" class="node-title">ArxivAuthorName</text>
    <text x="105" y="270" class="node-text">name: 저자 이름</text>
    <text x="105" y="302" class="node-text">동명이인은 이름 표기를</text>
    <text x="105" y="328" class="node-text">기준으로 하나의 노드로 관리</text>
    <text x="105" y="360" class="node-text">label: author</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="470" y="145" width="380" height="300" rx="18" fill="#0f766e"/>
    <text x="505" y="190" class="node-title">ArxivPaper</text>
    <text x="505" y="230" class="node-text">arxiv_id · title · abstract</text>
    <text x="505" y="258" class="node-text">published · pdf_url · source</text>
    <text x="505" y="286" class="node-text">primary_category · categories</text>
    <text x="505" y="314" class="node-text">embedding (768 dimensions)</text>
    <line x1="505" y1="340" x2="815" y2="340" stroke="#99f6e4" stroke-opacity=".55"/>
    <text x="505" y="374" class="node-text">분류는 별도 노드가 아닌 속성</text>
    <text x="505" y="402" class="node-text">Vector index: title + abstract</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="930" y="190" width="200" height="190" rx="18" fill="#7c3aed"/>
    <text x="960" y="232" class="node-title">ArxivPaper</text>
    <text x="960" y="270" class="node-text">참고된 논문</text>
    <text x="960" y="302" class="node-text">동일한 스키마</text>
    <text x="960" y="334" class="node-text">다른 논문과 연결</text>
    <text x="960" y="366" class="node-text">source = reference</text>
  </g>

  <path d="M365 275 L470 275" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="389" y="255" class="edge">AUTHORED</text>
  <text x="387" y="300" class="note">저자 → 논문</text>
  <path d="M850 275 L930 275" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="856" y="255" class="edge">REFERENCES</text>
  <text x="866" y="300" class="note">인용 → 피인용</text>

  <rect x="150" y="500" width="900" height="82" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="185" y="532" class="note">분류 설계</text>
  <text x="185" y="560" class="mono">p.primary_category = "cs.AI"   ·   p.categories = ["cs.AI", "cs.CL"]</text>
  <text x="710" y="532" class="note">Category 노드·IN_CATEGORY 관계는</text>
  <text x="710" y="560" class="note">Aura Free 한도 때문에 사용하지 않음</text>
</svg>
